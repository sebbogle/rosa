<dialog
  #layer
  class="drawer"
  role="navigation"
  aria-label="Contents"
  closedby="none"
  (click)="beside($event)"
>
  <div class="searchwrap">
    <label class="searchbox">
      <app-icon class="magnifier" name="magnifier" />

      <input
        #searchField
        class="search"
        type="search"
        placeholder="Search recipes…"
        aria-label="Search recipes"
        autocomplete="off"
        [value]="query()"
        (input)="search($event)"
      />
    </label>

    <button type="button" class="shut" aria-label="Close Contents" (click)="close()">
      <app-icon name="close" [size]="0.85" />
    </button>
  </div>

  <div class="tree">
    <app-folder-tree (surfaced)="findSearch()" />
  </div>

  <app-update-card />

  <footer class="foot">
    <button type="button" class="addnew" (click)="add()">
      <app-icon name="plus" [size]="0.92" />
      Add new recipe
    </button>
  </footer>

  <app-grip [edge]="edge" label="Contents edge" />
</dialog>
