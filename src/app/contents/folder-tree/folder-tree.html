@for (row of rows(); track row.key) {
  <div class="line" [class.menu-open]="menuAt() === row.key">
    @for (guide of row.guides; track guide) {
      <span class="guide" aria-hidden="true"></span>
    }

    @if (row.kind === 'folder') {
      @if (renamingAt() === row.key) {
        <input
          #renameField
          class="rename"
          type="text"
          autocomplete="off"
          [attr.aria-label]="'Rename ' + row.name"
          [value]="row.name"
          (blur)="commitRename(row, $event)"
          (keydown.enter)="commitRename(row, $event)"
        />
      } @else {
        <button
          type="button"
          class="row folder"
          [attr.data-key]="row.key"
          [attr.aria-expanded]="row.expanded"
          (click)="toggle(row.key)"
        >
          <span class="chevron" [class.open]="row.expanded" aria-hidden="true">▸</span>
          <span class="label">{{ row.name }}</span>
        </button>

        <button
          type="button"
          class="more"
          [attr.aria-label]="'Folder actions for ' + row.name"
          (click)="menu(row.key)"
        >
          ⋯
        </button>

        @if (menuAt() === row.key) {
          <div class="menu" role="menu">
            <button type="button" role="menuitem" (click)="startRename(row)">Rename</button>
            <button type="button" role="menuitem" (click)="askRemove(row)">Remove</button>
          </div>
        }
      }
    } @else {
      <button
        type="button"
        class="row recipe"
        [class.active]="row.id === openedId()"
        (click)="read(row.id, $event)"
        (dblclick)="keep(row.id)"
        (auxclick)="middleClick(row.id, $event)"
        (mousedown)="suppressAutoscroll($event)"
      >
        <span class="label">{{ row.title }}</span>
      </button>
    }
  </div>
}

@if (nothingMatches()) {
  <p class="nomatch">No recipes match {{ quoted() }}.</p>
}

@if (removing(); as ask) {
  <app-confirm [ask]="ask" (keep)="keepIt()" (act)="confirmRemove()" />
}
