<div class="label-line">
  <span class="label">{{ label() }}</span>
  <ng-content />
</div>

<div
  class="groups"
  cdkDropList
  [cdkDropListSortPredicate]="belowTheFirst"
  (cdkDropListDropped)="dropGroup($event)"
>
  @for (block of blocks(); track $index; let at = $index) {
    <div class="place" cdkDrag [cdkDragDisabled]="at === 0" (cdkDragStarted)="buzz($event)">
      <div
        class="block"
        role="group"
        [attr.aria-label]="at === 0 ? 'No group' : block.group.trim() || 'Unnamed group'"
        [class.grouped]="at > 0"
        cdkDropList
        [id]="lists()[at]"
        [cdkDropListData]="at"
        [cdkDropListConnectedTo]="lists()"
        (cdkDropListDropped)="dropRow($event)"
      >
        @if (at > 0) {
          <app-group-head
            [column]="column()"
            [block]="at"
            [group]="block.group"
            [collapsed]="block.collapsed"
            (insert)="insertGroup(at + 1)"
          />
        }

        @if (at === 0 || !block.collapsed) {
          <div class="rows">
            @for (row of block.rows; track $index; let index = $index) {
              <app-block-row
                cdkDrag
                [column]="column()"
                [block]="at"
                [index]="index"
                [row]="row"
                (cdkDragStarted)="buzz($event)"
              />
            }
          </div>

          <div class="more-rows">
            <button type="button" (click)="add(at)">{{ addLabel() }}</button>
          </div>
        }
      </div>

      <div class="divider">
        <span class="rule"></span>
        <button type="button" (click)="insertGroup(at + 1)">+ Group here</button>
        <span class="rule"></span>
      </div>
    </div>
  }
</div>
