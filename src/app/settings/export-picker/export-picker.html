<div class="row">
  <div class="text">
    <h3 class="label">Export</h3>

    @if (line(); as said) {
      <p id="export-line" class="sub lands">{{ said }}</p>
    }
  </div>

  @if (!open()) {
    <button
      #opener
      type="button"
      class="quiet"
      [attr.aria-disabled]="exportable() ? null : 'true'"
      [attr.aria-describedby]="exportable() ? null : 'export-line'"
      (click)="show()"
    >
      Export
    </button>
  }
</div>

@if (open()) {
  <div
    #panel
    class="panel picking"
    role="region"
    aria-label="Choose recipes"
    [class.leaving]="leaving()"
  >
    <div class="listbox">
      <div class="search">
        <span class="magnifier" aria-hidden="true">
          <svg
            width="13"
            height="13"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          >
            <circle cx="7" cy="7" r="4.5" />
            <path d="M10.5 10.5L14 14" />
          </svg>
        </span>

        <input
          #filter
          class="find"
          type="search"
          placeholder="Filter recipes…"
          aria-label="Filter recipes"
          autocomplete="off"
          [value]="typed()"
          (input)="search($event)"
        />

        @if (tally().any) {
          <button type="button" class="small" (click)="clear()">Clear</button>
        }

        <button
          #sweeper
          type="button"
          class="small"
          [attr.aria-disabled]="sweep().nothing ? 'true' : null"
          (click)="sweepMatching()"
        >
          Tick all
        </button>
      </div>

      <div class="tree">
        @for (row of rows(); track row.key) {
          <div class="line" [style.--depth]="row.depth">
            @if (row.kind === 'folder') {
              <button
                type="button"
                class="chevron"
                [class.open]="row.expanded"
                [attr.aria-expanded]="row.expanded"
                [attr.aria-label]="(row.expanded ? 'Collapse ' : 'Expand ') + row.name"
                (click)="toggle(row.key)"
              >
                <span class="glyph" aria-hidden="true">▸</span>
              </button>

              <label class="item folder">
                <input
                  type="checkbox"
                  class="tick"
                  [checked]="row.tick === 'all'"
                  [indeterminate]="row.tick === 'some'"
                  (change)="tickFolder(row, $event)"
                />
                <span class="tickbox" aria-hidden="true">
                  <svg class="mark" width="10" height="10" viewBox="0 0 16 16">
                    <path d="M3 8.5l3.2 3L13 4.5" />
                  </svg>
                  <span class="dash"></span>
                </span>
                <span class="name">{{ row.name }}</span>
              </label>
            } @else {
              <span class="spacer" aria-hidden="true"></span>

              <label class="item recipe" [class.outside]="row.outside">
                <input
                  type="checkbox"
                  class="tick"
                  [checked]="row.ticked"
                  (change)="tickRecipe(row.id, $event)"
                />
                <span class="tickbox" aria-hidden="true">
                  <svg class="mark" width="10" height="10" viewBox="0 0 16 16">
                    <path d="M3 8.5l3.2 3L13 4.5" />
                  </svg>
                </span>
                <span class="name">{{ row.title }}</span>
              </label>
            }
          </div>
        } @empty {
          <p class="nomatch">Nothing matches {{ quoted() }}, and nothing is set to export.</p>
        }
      </div>
    </div>

    <div class="foot">
      <app-segmented
        label="Format"
        [options]="formats"
        [chosen]="format()"
        (choose)="choose($event)"
      />

      <span class="note" role="status">{{ tally().hidden }}</span>

      <button type="button" class="quiet" (click)="cancel()">Cancel</button>

      <button type="button" class="primary" [disabled]="!tally().any" (click)="send()">
        {{ exportLabel() }}
      </button>
    </div>
  </div>
}
